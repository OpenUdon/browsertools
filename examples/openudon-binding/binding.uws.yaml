uws: "1.5.0"
info:
  title: Wikipedia Article Lookup — browser-profile binding example
  summary: >
    Minimal example showing how a UWS workflow binds to a reviewed
    browser-profile source via sourceDescriptions, operations with
    sourceOperationId, and workflow steps with operationRef. This pattern
    is what github.com/OpenUdon/openudon consumes.
  version: "1.0.0"

sourceDescriptions:
  - name: wikipedia-profile
    type: browser-profile
    url: ../wikipedia-lookup/browser-profiles/wikipedia.yaml

operations:
  - operationId: go_to_article
    sourceDescription: wikipedia-profile
    sourceOperationId: navigate_to_article
    request:
      body:
        title: "$inputs.title"
    outputs:
      is_disambiguation: "$response.body.is_disambiguation"

  - operationId: get_article
    sourceDescription: wikipedia-profile
    sourceOperationId: extract_article
    outputs:
      name:        "$response.body.name"
      description: "$response.body.description"
      categories:  "$response.body.categories"

workflows:
  - workflowId: lookup_article
    type: sequence
    inputs:
      type: object
      required: [title]
      properties:
        title:
          type: string
    steps:
      - stepId: navigate
        operationRef: go_to_article
        inputs:
          title: "$inputs.title"

      - stepId: extract
        operationRef: get_article
        dependsOn: [navigate]

    outputs:
      article: "$steps.extract.outputs"
